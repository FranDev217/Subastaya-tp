services:
    db:
      image: postgres:16
      container_name: subastaya-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: subastaya
        POSTGRES_USER: subastaya
        POSTGRES_PASSWORD: subastaya
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U subastaya -d subastaya" ]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
    pgdata:
